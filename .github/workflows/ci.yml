name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_ENV: test
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run Django test suite
        run: python manage.py test

  security:
    name: Dependency and static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and security tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q config praticas

      - name: Block high-severity, high-confidence findings
        run: python -m bandit -r config praticas -x praticas/migrations --severity-level high --confidence-level high
