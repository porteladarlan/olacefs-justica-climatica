<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma Regional{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="{% url 'pagina_inicial' %}">OLACEFS Justi&ccedil;a Clim&aacute;tica</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'pagina_inicial' %}">In&iacute;cio</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'catalogo_experiencias' %}">Cat&aacute;logo</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'banco_tecnico' %}">Banco T&eacute;cnico</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'sobre_plataforma' %}">Sobre</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<footer class="bg-light border-top py-3 mt-5">
    <div class="container text-muted small">
        MVP local da Plataforma Regional de Boas Pr&aacute;ticas em Auditoria com Perspectiva de Justi&ccedil;a Clim&aacute;tica.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
