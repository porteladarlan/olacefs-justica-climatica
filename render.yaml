services:
  - type: web
    name: olacefs-justica-climatica
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: DJANGO_ENV
        value: staging
      - key: TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,127.0.0.1,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: olacefs-justica-db
          property: connectionString

databases:
  - name: olacefs-justica-db
    databaseName: olacefs_justica
    user: olacefs_justica_user
